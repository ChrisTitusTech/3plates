name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate shared contract package
        run: pnpm --filter @3plates/contract test

      - name: Typecheck workspace
        run: pnpm typecheck

  migration-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Drizzle migration artifacts are committed
        run: |
          pnpm --filter @3plates/db generate
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git ls-files --others --exclude-standard -- packages/db/drizzle)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - contract-and-typecheck
      - migration-drift-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production API
        run: pnpm --filter @3plates/api build

      - name: Run workspace tests
        run: pnpm test

      - name: Run database smoke test
        shell: bash
        run: |
          NODE_ENV=production node apps/api/dist/main.js > /tmp/3plates-api.log 2>&1 &
          api_pid=$!

          # shellcheck disable=SC2329 # Invoked by the EXIT trap.
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              pnpm db:test
              exit 0
            fi

            if ! kill -0 "$api_pid" >/dev/null 2>&1; then
              cat /tmp/3plates-api.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/3plates-api.log
          exit 1

  client-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [web, android, ios]
    env:
      EXPO_PUBLIC_API_URL: https://api.3spinningplates.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Expo dependency compatibility
        env:
          # Validate against the installed SDK, rather than changing remote recommendations.
          EXPO_OFFLINE: '1'
        run: pnpm --filter @3plates/mobile exec expo install --check
      - name: Export production client bundle
        run: pnpm --filter @3plates/mobile exec expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}

  shell-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts
        run: |
          for script in scripts/*.sh apps/whoop/deploy/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh apps/whoop/deploy/*.sh
          python3 scripts/deploy-web.test.py
          python3 apps/whoop/deploy/test-ops.py

  whoop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gallant_test
          POSTGRES_USER: gallant_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U gallant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3plates/whoop check
      - run: pnpm --filter @3plates/whoop test:db
      - run: pnpm --filter @3plates/whoop exec playwright install --with-deps chromium
      - run: pnpm --filter @3plates/whoop test:browser

  fitness-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @3plates/mobile exec playwright install --with-deps chromium
      - run: pnpm --filter @3plates/mobile exec expo export --platform web --output-dir dist
      - run: pnpm --filter @3plates/mobile test:browser

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://api.3spinningplates.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: pnpm --filter @3plates/mobile exec expo prebuild --platform android --no-install
      - name: Compile Android release with local debug signing
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

  ios-native:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://api.3spinningplates.com
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate iOS project and install pods
        run: pnpm --filter @3plates/mobile exec expo prebuild --platform ios
      - name: Compile iOS simulator release without signing
        working-directory: apps/mobile/ios
        run: |
          workspace=( *.xcworkspace )
          test "${#workspace[@]}" -eq 1
          scheme="${workspace[0]%.xcworkspace}"
          xcodebuild -workspace "${workspace[0]}" -scheme "$scheme" \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/3plates-ios" CODE_SIGNING_ALLOWED=NO build
